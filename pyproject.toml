[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drl-context-poi"
version = "0.2.1"
description = "Budgeted sequential context acquisition for next-POI recommendation"
requires-python = ">=3.11"
dependencies = ["torch>=2.3,<3", "numpy>=1.24,<3", "pandas>=2,<4", "PyYAML>=6,<7", "psutil>=5.9,<8"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
baselines = ["scipy>=1.11,<2", "scikit-learn>=1.4,<2", "torch-geometric>=2.5,<3"]
plots = ["matplotlib>=3.7,<4"]
[project.scripts]
drlpoi = "drlpoi.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
