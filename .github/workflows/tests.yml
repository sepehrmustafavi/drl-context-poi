name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests --select F
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,baselines]'
      - run: |
          for model in sasrec getnext dchl ipcm; do
            python scripts/fetch_upstream.py "$model"
          done
      - run: python -m pytest tests/test_upstream.py -q
        env:
          DRLPOI_UPSTREAM_ROOT: ${{ github.workspace }}/artifacts/upstream
