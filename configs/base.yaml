seed: 11
device: auto
threads: 4
split_fractions: [0.5, 0.2, 0.1, 0.2]
min_history: 3
recent: 20
block_size: 20
periodic_hour_window: 2
sources: [remote, periodic, transition, category]
disabled_sources: []
backbone: transformer
dim: 64
heads: 4
layers: 2
dropout: 0.1
ensemble: 3
batch_size: 128
epochs: 30
patience: 5
learning_rate: 0.001
weight_decay: 0.0001
amp: true
score_chunk: 4096
policy_epochs: 15
policy_steps_per_epoch: 20000
policy_batch_size: 128
policy_eval_batch_size: 512
replay_capacity: 50000
replay_warmup: 512
q_hidden: 128
q_lr: 0.0003
target_interval: 250
epsilon_start: 1.0
epsilon_end: 0.05
lambda_cost: 0.1
budget_fraction: 0.5
max_acquisitions: 4
# Null requires `profile-cost` before training learned policies.
costs: null
fixed_order: [0, 1, 2, 3]
entropy_threshold: 0.7
hpo_candidates: 6
bootstrap_samples: 2000
quality_tolerance: 0.002
